{{ define "main" }}
<div class="container is-fluid">
  <div class="container pt-6 pb-4">
    <div class="columns">
      <div class="column is-four-fifths">
        <p class="writing-meta has-text-grey is-size-7 mb-2">{{ .Date.Format "January 2, 2006" }} &middot; {{ .ReadingTime }} min read</p>
        <h3 class="is-size-3 sawarabi-mincho-regular is-dark-grey">{{ .Title }}</h3>
        <div class="separator-bar is-short"></div>
      </div>
      <div class="column"></div>
    </div>
  </div>
  <div class="container pt-5 pb-6">
    <div class="columns">
      <div class="column is-four-fifths">
        <div class="writing-body is-dark-grey">
          {{ .Content }}
        </div>
        {{ with .Params.topics }}
        <div class="tags pt-6">
          {{ range . }}<span class="tag is-black is-medium">{{ . }}</span>{{ end }}
        </div>
        {{ end }}
        <p class="pt-5"><a class="writing-back is-dark-grey" href="/writing/">&larr; Back to Writing</a></p>
      </div>
      <div class="column"></div>
    </div>
  </div>
  {{ partial "floating_menu" . }}
</div>
{{ end }}
